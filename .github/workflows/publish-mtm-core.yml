name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant exec permission
        run: chmod +x gradlew

      # 1. Extrair Versão Atual
      - name: Extract current version
        id: curr_version
        run: |
          # Pega a versão tratando aspas simples ou duplas
          VERSION=$(grep -E '^version\s*=' build.gradle.kts | sed "s/.*['\"]\(.*\)['\"].*/\1/")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 2. Extrair Versão Base (Lógica corrigida para Push vs PR)
      - name: Extract base version
        id: base_version
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # No PUSH na develop, comparamos com o commit imediatamente anterior ao merge
            git show HEAD~1:build.gradle.kts > base-build.gradle.kts || echo 'version = "0.0.0"' > base-build.gradle.kts
          else
            # No PR, comparamos com a versão que está na develop remota agora
            git fetch origin develop
            git show origin/develop:build.gradle.kts > base-build.gradle.kts || echo 'version = "0.0.0"' > base-build.gradle.kts
          fi
          VERSION=$(grep -E '^version\s*=' base-build.gradle.kts | sed "s/.*['\"]\(.*\)['\"].*/\1/" || echo "0.0.0")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # 3. Comparar Versões
      - name: Check if version bumped
        id: check_bump
        run: |
          echo "Versão Base: ${{ steps.base_version.outputs.version }}"
          echo "Versão Atual: ${{ steps.curr_version.outputs.version }}"
          if [ "${{ steps.curr_version.outputs.version }}" != "${{ steps.base_version.outputs.version }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "MUDANÇA DETECTADA: Publicação autorizada."
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "SEM MUDANÇA: O passo de publicação será pulado."
          fi

      # 4. Rodar Testes
      - name: Run Tests
        run: |
          ./gradlew test \
            -Pgpr.user=${{ github.actor }} \
            -Pgpr.token=${{ secrets.GITHUB_TOKEN }} \
            --no-daemon

      # 5. Publicar (Agora o logic gate vai abrir no PUSH)
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && steps.check_bump.outputs.changed == 'true'
        run: |
          ./gradlew publish \
            -Pgpr.user=${{ github.actor }} \
            -Pgpr.token=${{ secrets.GITHUB_TOKEN }} \
            --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}